<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

        <h1>Contact Us</h1>

        <form id="contactForm" class="p-4 border rounded" onsubmit="return validate()">

            <label>Name:</label>
            <input type="text" id="name" placeholder="Your name" required>

            <label>Email:</label>
            <input type="email" id="email" placeholder="Your email" required>


            <!-- email -->
             <!-- <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" name="email" placeholder="Your Email">
               
                <span class="text-danger" id="emailError">

                </span>
                 </div> -->


            <label>Mobile Number:</label>
            <input type="text" id="mobile" placeholder="Your mobile number" required>

            <!-- password -->
            <div class="mb-3">
                <label for="Password" class="form-label">Email</label>
                <input type="text" class="form-control" id="Password" name="Password" placeholder="Enter Password">
               
                <span class="text-danger" id="passwordError">

                </span>
                 </div>


            <!-- <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password" required> -->

            <label>Confirm Password:</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm password" required>

            <!-- message -->
            <div class="mb-3">
                <label for="Message" class="form-label">Message:</label>
                <textarea class="form-control" id="Message" name="Message" placeholder="Enter Message"></textarea>               
                <span class="text-danger" id="MessageError">

                </span>
                 </div>

            <!-- <label>Message:</label>
            <textarea id="message" placeholder="Your message" required></textarea> -->


            <!-- Gender -->
            <div class="mb-3">
                <label class="form-label">Gender:</label><br>
                <input type="radio" id="male" name="gender" value="Male">Male
                <input type="radio" id="female" name="gender" value="Female" class="ms-3">Female
                <input type="radio" id="other" name="gender" value="Other" class="ms-3">Other
                <br>
                <span class="text-danger" id="genderError"></span>
            </div>


            <!-- <label>Gender:</label>

            <div class="gender">

            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
             -->

                <!-- <label>
                    <input type="radio" name="gender" value="male" onclick="this.checked ? this.checked=false : this.checked=true;"> Male

                </label>

                <label>
                    <input type="radio" name="gender" value="Female" required>
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other" required>
                    Other
                </label> -->

            <!-- checkbox -->
            <div class="mb-3">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree"> I agree to the terms & conditions </label>
                <br>
                <span class="text-danger" id="agreeError"></span>
            </div>
            

            <!-- submit -->
             <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Submit</button>
             </div>

        </form>

    </div>
</div>
</div>


<!-- bootstrap js -->
