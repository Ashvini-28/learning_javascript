 <!-- comparison operators ==,===,>,<,>=,<= -->


 <script>
    var k = 10;
    var l = 5;
    document.write("<br>");
    if(k == l){//only value is compared
        document.write("True");
    }else{
        document.write("False")
    }


    var M = 10;
    var N = 10;
    document.write("<br>");
    if(M === N){//value and datatype is compared
        document.write("True");
    }else{
        document.write("False")
    }

 </script>
