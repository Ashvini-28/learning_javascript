<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a ="Hello";//string
        var b = 10;//integer
        var c = true;//boolean
        var d =["HTML","CSS","JS"];//
        var e = {fname:"riya",lname:"Doe"};
        var f = null;
        var g;
        function myFunc(){
            return "Hello World";
        }
        myFunc();

        document.write(a + "<br>");
        document.write(typeof a);

        document.write("<br>" + b + "<br>");
        document.write(typeof b);

        document.write("<br>" + c + "<br>");
        document.write(typeof c);

        document.write("<br>" + d + "<br>");
        document.write(typeof d);

        document.write("<br>" + e + "<br>");
        document.write(typeof e);

        document.write("<br>" + f + "<br>");
        document.write(typeof f);

        document.write("<br>" + g + "<br>");
        document.write(typeof g);
    </script>
</body>
</html>
